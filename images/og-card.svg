<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1f22"/>
      <stop offset="100%" stop-color="#141719"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="rgba(255,7,58,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#ff073a"/>
      <stop offset="70%" stop-color="rgba(100,150,255,0.4)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#topLine)" opacity="0.7"/>

  <!-- Subtle grid dots (network feel) -->
  <g opacity="0.04" fill="#fff">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/><circle cx="300" cy="100" r="1.5"/>
    <circle cx="400" cy="100" r="1.5"/><circle cx="500" cy="100" r="1.5"/><circle cx="600" cy="100" r="1.5"/>
    <circle cx="700" cy="100" r="1.5"/><circle cx="800" cy="100" r="1.5"/><circle cx="900" cy="100" r="1.5"/>
    <circle cx="1000" cy="100" r="1.5"/><circle cx="1100" cy="100" r="1.5"/>
    <circle cx="100" cy="200" r="1.5"/><circle cx="200" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/>
    <circle cx="400" cy="200" r="1.5"/><circle cx="500" cy="200" r="1.5"/><circle cx="600" cy="200" r="1.5"/>
    <circle cx="700" cy="200" r="1.5"/><circle cx="800" cy="200" r="1.5"/><circle cx="900" cy="200" r="1.5"/>
    <circle cx="1000" cy="200" r="1.5"/><circle cx="1100" cy="200" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/>
    <circle cx="400" cy="300" r="1.5"/><circle cx="500" cy="300" r="1.5"/><circle cx="600" cy="300" r="1.5"/>
    <circle cx="700" cy="300" r="1.5"/><circle cx="800" cy="300" r="1.5"/><circle cx="900" cy="300" r="1.5"/>
    <circle cx="1000" cy="300" r="1.5"/><circle cx="1100" cy="300" r="1.5"/>
    <circle cx="100" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/>
    <circle cx="400" cy="400" r="1.5"/><circle cx="500" cy="400" r="1.5"/><circle cx="600" cy="400" r="1.5"/>
    <circle cx="700" cy="400" r="1.5"/><circle cx="800" cy="400" r="1.5"/><circle cx="900" cy="400" r="1.5"/>
    <circle cx="1000" cy="400" r="1.5"/><circle cx="1100" cy="400" r="1.5"/>
    <circle cx="100" cy="500" r="1.5"/><circle cx="200" cy="500" r="1.5"/><circle cx="300" cy="500" r="1.5"/>
    <circle cx="400" cy="500" r="1.5"/><circle cx="500" cy="500" r="1.5"/><circle cx="600" cy="500" r="1.5"/>
    <circle cx="700" cy="500" r="1.5"/><circle cx="800" cy="500" r="1.5"/><circle cx="900" cy="500" r="1.5"/>
    <circle cx="1000" cy="500" r="1.5"/><circle cx="1100" cy="500" r="1.5"/>
  </g>

  <!-- Network lines (subtle transmission network) -->
  <g stroke="rgba(255,7,58,0.06)" stroke-width="0.8" fill="none">
    <line x1="750" y1="150" x2="850" y2="220"/>
    <line x1="850" y1="220" x2="950" y2="180"/>
    <line x1="950" y1="180" x2="1050" y2="250"/>
    <line x1="850" y1="220" x2="900" y2="320"/>
    <line x1="900" y1="320" x2="1000" y2="350"/>
    <line x1="1000" y1="350" x2="1050" y2="250"/>
    <line x1="1050" y1="250" x2="1100" y2="330"/>
    <line x1="750" y1="350" x2="850" y2="400"/>
    <line x1="850" y1="400" x2="900" y2="320"/>
    <line x1="750" y1="350" x2="750" y2="150"/>
    <line x1="1000" y1="350" x2="1080" y2="450"/>
    <line x1="1100" y1="330" x2="1080" y2="450"/>
  </g>

  <!-- Network nodes -->
  <g>
    <circle cx="750" cy="150" r="4" fill="rgba(160,160,160,0.15)" stroke="rgba(160,160,160,0.2)" stroke-width="1"/>
    <circle cx="850" cy="220" r="5" fill="rgba(255,7,58,0.2)" stroke="rgba(255,7,58,0.35)" stroke-width="1"/>
    <circle cx="950" cy="180" r="3.5" fill="rgba(160,160,160,0.15)" stroke="rgba(160,160,160,0.2)" stroke-width="1"/>
    <circle cx="1050" cy="250" r="5" fill="rgba(255,7,58,0.2)" stroke="rgba(255,7,58,0.35)" stroke-width="1"/>
    <circle cx="900" cy="320" r="4" fill="rgba(255,7,58,0.15)" stroke="rgba(255,7,58,0.25)" stroke-width="1"/>
    <circle cx="1000" cy="350" r="3.5" fill="rgba(160,160,160,0.15)" stroke="rgba(160,160,160,0.2)" stroke-width="1"/>
    <circle cx="1100" cy="330" r="4" fill="rgba(255,7,58,0.2)" stroke="rgba(255,7,58,0.35)" stroke-width="1"/>
    <circle cx="750" cy="350" r="3" fill="rgba(160,160,160,0.15)" stroke="rgba(160,160,160,0.2)" stroke-width="1"/>
    <circle cx="850" cy="400" r="4.5" fill="rgba(255,7,58,0.15)" stroke="rgba(255,7,58,0.25)" stroke-width="1"/>
    <circle cx="1080" cy="450" r="3.5" fill="rgba(160,160,160,0.15)" stroke="rgba(160,160,160,0.2)" stroke-width="1"/>
  </g>

  <!-- Virus icon -->
  <g transform="translate(100, 180)">
    <!-- Core -->
    <circle cx="0" cy="0" r="28" fill="rgba(255,7,58,0.18)" stroke="rgba(255,7,58,0.35)" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="18" fill="rgba(255,7,58,0.25)"/>
    <!-- Spikes -->
