    <circle cx="0" cy="-44" r="4" fill="rgba(255,7,58,0.5)"/>
    <line x1="0" y1="28" x2="0" y2="44" stroke="rgba(255,7,58,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="44" r="4" fill="rgba(255,7,58,0.5)"/>
    <line x1="-28" y1="0" x2="-44" y2="0" stroke="rgba(255,7,58,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-44" cy="0" r="4" fill="rgba(255,7,58,0.5)"/>
    <line x1="28" y1="0" x2="44" y2="0" stroke="rgba(255,7,58,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="44" cy="0" r="4" fill="rgba(255,7,58,0.5)"/>
    <line x1="-19.8" y1="-19.8" x2="-31.1" y2="-31.1" stroke="rgba(255,7,58,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-31.1" cy="-31.1" r="4" fill="rgba(255,7,58,0.5)"/>
    <line x1="19.8" y1="-19.8" x2="31.1" y2="-31.1" stroke="rgba(255,7,58,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="31.1" cy="-31.1" r="4" fill="rgba(255,7,58,0.5)"/>
    <line x1="-19.8" y1="19.8" x2="-31.1" y2="31.1" stroke="rgba(255,7,58,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-31.1" cy="31.1" r="4" fill="rgba(255,7,58,0.5)"/>
    <line x1="19.8" y1="19.8" x2="31.1" y2="31.1" stroke="rgba(255,7,58,0.4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="31.1" cy="31.1" r="4" fill="rgba(255,7,58,0.5)"/>
    <!-- Glow -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="rgba(255,7,58,0.04)" stroke-width="12"/>
  </g>

  <!-- Eyebrow -->
  <text x="100" y="300" font-family="monospace" font-size="13" letter-spacing="4" fill="#ff073a" text-transform="uppercase">REAL-TIME OUTBREAK ANALYTICS</text>

  <!-- Title: Noso -->
  <text x="100" y="380" font-family="'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="80" fill="#ffffff" letter-spacing="-2">Noso<tspan fill="#ff073a">Track</tspan></text>

  <!-- Subtitle -->
  <text x="100" y="430" font-family="'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="20" fill="rgba(236,236,236,0.85)">Infers who infected whom in near real-time.</text>
  <text x="100" y="458" font-family="'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="20" fill="rgba(236,236,236,0.85)">Stop outbreaks before they escalate.</text>

  <!-- Institutions -->
  <g transform="translate(100, 530)">
    <line x1="0" y1="-20" x2="520" y2="-20" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="rgba(255,255,255,0.35)" text-transform="uppercase">
      <tspan>JOHNS HOPKINS UNIVERSITY</tspan>
      <tspan dx="28">IMPERIAL COLLEGE LONDON</tspan>
      <tspan dx="28">R EPIDEMICS CONSORTIUM</tspan>
    </text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#topLine)" opacity="0.5"/>

  <!-- Domain -->
  <text x="1100" y="600" font-family="monospace" font-size="13" letter-spacing="1" fill="rgba(255,255,255,0.2)" text-anchor="end">nosotrack.com</text>
</svg>
