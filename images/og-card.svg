<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    NosoTrack — Open Graph card (Design v2 / Palantir-inspired)
    Light cream surface · ink + alert red · JetBrains Mono
  -->

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f1f0f1"/>
      <stop offset="100%" stop-color="#e8e7e8"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.18" cy="0.22" r="0.85">
      <stop offset="0%"   stop-color="rgba(30,30,43,0.06)"/>
      <stop offset="60%"  stop-color="rgba(30,30,43,0)"/>
    </radialGradient>
  </defs>

  <!-- Surface -->
  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Brand mark (bracketed network with red core), scaled 32→360 -->
  <g transform="translate(80, 135) scale(11.25)" fill="none" stroke="#1e1e2b" stroke-linecap="square">
    <path d="M3 8 L3 3 L8 3"   stroke-width="1.2"/>
    <path d="M24 3 L29 3 L29 8" stroke-width="1.2"/>
    <path d="M29 24 L29 29 L24 29" stroke-width="1.2"/>
    <path d="M8 29 L3 29 L3 24"   stroke-width="1.2"/>
    <g stroke-linecap="round">
      <line x1="16.00" y1="11.20" x2="16.00" y2="15.60" stroke-width="0.55"/>
      <line x1="11.31" y1="19.30" x2="15.13" y2="17.10" stroke-width="0.55"/>
      <line x1="20.69" y1="19.30" x2="16.87" y2="17.10" stroke-width="0.55"/>
      <circle cx="16"   cy="9"    r="2.2"  stroke-width="0.35"/>
      <circle cx="9.4"  cy="20.4" r="2.2"  stroke-width="0.35"/>
      <circle cx="22.6" cy="20.4" r="2.2"  stroke-width="0.35"/>
      <circle cx="16"   cy="16.6" r="1.05" fill="#ff073a" stroke="none"/>
    </g>
  </g>

  <!-- Eyebrow -->
  <text x="500" y="240"
        font-family="'JetBrains Mono','Consolas',ui-monospace,monospace"
        font-size="22" font-weight="500" letter-spacing="6"
        fill="#ff073a">TRANSMISSION INTELLIGENCE</text>

  <!-- Wordmark -->
  <text x="500" y="370"
        font-family="'JetBrains Mono','Consolas',ui-monospace,monospace"
        font-size="100" font-weight="500" letter-spacing="-3">
    <tspan fill="#1e1e2b">Noso</tspan><tspan fill="#ff073a">Track</tspan>
  </text>

  <!-- Tagline -->
  <text x="500" y="440"
        font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif"
        font-size="36" font-weight="400" fill="#1e1e2b" letter-spacing="-0.5">
    outbreak forensics
  </text>
</svg>
