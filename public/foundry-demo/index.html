<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosotrack Foundry Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #fafafa;
      color: #efeeef;
      font-family: 'Inter Tight', sans-serif;
      height: 100%;
      overflow: hidden;
    }
    body { display: flex; align-items: center; justify-content: center; }
    #root { width: 100vw; height: 100vh; }

    /* Embed mode — ?embed=1 on the iframe src. */
    body.embed { background: transparent; }

    @keyframes fdyPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.4); }
    }
    @keyframes fdyDash {
      to { stroke-dashoffset: -24; }
    }
    @keyframes fdyRingOut {
      0% { transform: scale(0.4); opacity: 0.7; }
      100% { transform: scale(1.4); opacity: 0; }
    }
  </style>

  <!-- Must run pre-boot so embed-only CSS applies before first paint. -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (!params.has('embed')) return;
      document.addEventListener('DOMContentLoaded', function () {
        document.body.classList.add('embed');
      });
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Generated by `npm run build:demo` — do not edit. -->
  <script src="bundle.js"></script>
</body>
</html>
